substitutions:
  hostname: 'sonoffpowr2'
web_server:
  port: 80
esphome:
  name: $hostname
  platform: ESP8266
  board: esp8285
  arduino_version: 2.4.2
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
api:
  reboot_timeout: 0s
ota:
logger:
  baud_rate: 0

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Sonoff Basic Button"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Sonoff Basic Relay"
    pin: GPIO12
    id: relay

status_led:
  pin:
    number: GPIO13
    inverted: yes

uart:
  rx_pin: RX
  baud_rate: 4800

sensor:
  - platform: cse7766
    current:
      name: "HWC Current"
    voltage:
      name: "HWC Voltage"
    power:
      name: "HWC Power"