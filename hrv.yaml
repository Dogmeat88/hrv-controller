substitutions:
  hostname: 'hrv'
  devicename: HRV Controller
web_server:
  port: 80
esphome:
  name: $hostname
  platform: ESP32
  board: esp-wrover-kit
  arduino_version: recommended
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
api:
  reboot_timeout: 0s
ota:
logger:
  baud_rate: 0

output:
  - platform: ac_dimmer
    id: hrv_motor
    gate_pin: GPIO18
    zero_cross_pin:
      number: GPIO19
      mode: INPUT
      inverted: yes

fan:
  - platform: speed
    output: hrv_motor
    name: "HRV Attic Fan"
    id: hrv_fan

dallas:
  pin:
    number: GPIO13

sensor:
  - platform: dallas
    address: 0x900621b458bd0e28
    name: "Attic Temperature"
    id: attic_temp

  - platform: dallas
    address: 0x043c18f648b6a628
    name: "House Temperature"
    id: house_temp

interval:
  - interval: 1min
    then:
      - logger.log:
          format: "Comparing values: Attic: %.1f, House: %.1f"
          args: [ 'id(attic_temp).get_temp_c()', 'id(house_temp).get_temp_c()' ]
      - if:
          condition:
            lambda: 'return id(attic_temp).get_temp_c() > id(house_temp).get_temp_c();'
          then:
            - logger.log: "Set to 'Heat' mode"
            - lambda: |-
                auto call = id(hrv_thermostat).make_call();
                call.set_mode("HEAT");
                call.perform();
          else:
            - logger.log: "Set to 'Cool' mode"
            - lambda: |-
                auto call = id(hrv_thermostat).make_call();
                call.set_mode("COOL");
                call.perform();

climate:
  - platform: thermostat
    name: "HRV Thermostat"
    id: hrv_thermostat
    sensor: house_temp
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - fan.turn_on: hrv_fan
    cool_action:
      - fan.turn_on: hrv_fan
    idle_action:
      - fan.turn_off: hrv_fan
    default_preset: Default
    preset:
      - name: Default
        default_target_temperature_high: 20
        default_target_temperature_low: 18

