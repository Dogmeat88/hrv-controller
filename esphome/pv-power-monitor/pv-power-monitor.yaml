substitutions:
  hostname: 'pv-power-monitor'
  devicename: PV Power Monitor
web_server:
  port: 80
esphome:
  name: $hostname

esp32:
  board: nodemcu-32s
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
logger:
  level: DEBUG

uart:
  id: mod_bus
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 9600
  stop_bits: 1

modbus:
  # flow_control_pin: GPIOXX
  send_wait_time: 200ms
  id: modbus_jsy_mk_227

modbus_controller:
  - id: jsy_mk_227
    address: 0x01
    modbus_id: modbus_jsy_mk_227
    setup_priority: -10
    update_interval: 5s

sensor:
  - platform: modbus_controller
    modbus_controller_id: jsy_mk_227
    id: array_rated_voltage
    name: "Voltage1"
    address: 0x0100
    unit_of_measurement: "V"
    register_type: holding
    register_count: 1
    value_type: U_WORD
    filters:
      - multiply: 0.00001

  - platform: modbus_controller
    modbus_controller_id: jsy_mk_227
    name: "Voltage"
    id: total_energy
#    custom_command: [ 0x01, 0x03, 0x01, 0x01, 0x00, 0x02 ]
    custom_command: [ 0x01, 0x03, 0x01, 0x00, 0x00, 0x14, 0x44, 0x39 ]
    value_type: U_DWORD
    unit_of_measurement: V
    accuracy_decimals: 1
    lambda: |-
      ESP_LOGD("Modbus Sensor Lambda","Got new data" );
      union {
        float float_value;
        uint32_t raw;
      } raw_to_float;
      raw_to_float.raw =   data[0] << 24 | data[1] << 16 | data[2] << 8 |  data[3];
      ESP_LOGD("Modbus Sensor Lambda", "FP32 = 0x%08X => %f", raw_to_float.raw, raw_to_float.float_value);
      return raw_to_float.float_value;